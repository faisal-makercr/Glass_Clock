<!DOCTYPE hmtl>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clock</title>
        <link rel="stylesheet" href="/Clock/style.css"/>
    </head>
    <body>

        <div class="container">
            <div class="toggle">
            <input type="checkbox" id="darkBright-toggle"/>
            <label for="'darkmode-toggle"></label>
            </div>

            <div class="background"></div>

            <div class="circle one"></div>
            <div class="circle two"></div>

            <div class="clock">

                <div class="clock-bg">
                    <img src="./images/clock.png" alt=""...>
                </div>

                <div class="hour">
                    <span class="hr" id="hr"></span>
                </div>
                <div class="minute">
                    <span class="min" id="min"></span>
                </div>
                <div class="second">
                    <span class="sec" id="sec"></span>
                </div>

            </div>
        </div>
        <script src="/Clock/script.js"></script>
    </body>
</html>
